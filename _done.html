<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Казачьи заповеди</title>
<style>
  :root{
    --gold:#f0c96a; --gold-hi:#ffe9ad; --gold-lo:#8f6d22;
    --blue:#4a86ff; --blue-deep:#16295e;
    --ink:#efe9da; --ink-dim:#9c9485;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    height:100vh;
    background:
      radial-gradient(900px 520px at 50% -12%, rgba(74,134,255,.16), transparent 62%),
      radial-gradient(720px 420px at 88% 112%, rgba(74,134,255,.10), transparent 60%),
      radial-gradient(620px 360px at 8% 100%, rgba(240,201,106,.07), transparent 60%),
      linear-gradient(180deg,#04060d,#070b18 55%,#03050c);
    color:var(--ink);
    font-family:"Georgia","Times New Roman",serif;
    display:flex; flex-direction:column; align-items:center;
    padding:26px 20px 22px;
    overflow-x:hidden;
  }

  /* ambient layers */
  #dust{ position:fixed; inset:0; z-index:0; pointer-events:none }
  #glow{
    position:fixed; top:0; left:0; width:640px; height:640px; z-index:0;
    pointer-events:none; mix-blend-mode:screen;
    background:radial-gradient(circle, rgba(74,134,255,.13), rgba(240,201,106,.06) 38%, transparent 68%);
    transform:translate(-2000px,-2000px);
    transition:transform .55s ease-out;
  }
  .wrap{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; width:100%; flex:1 }

  header{text-align:center; margin-bottom:12px}
  h1{
    font-size:clamp(28px,4.5vw,52px); font-weight:700; margin:0 0 8px;
    letter-spacing:.1em;
    background:linear-gradient(100deg,#8f6d22 0%,#f7d98b 22%,#fff6d8 38%,#f7d98b 52%,#8f6d22 78%);
    background-size:260% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:titleIn 1.1s cubic-bezier(.2,.9,.25,1) backwards, shimmer 7s linear 1.2s infinite;
  }
  @keyframes titleIn{ from{ opacity:0; transform:translateY(26px); letter-spacing:.3em } }
  @keyframes shimmer{ 0%{background-position:0%} 100%{background-position:260%} }
  .sub{
    color:var(--ink-dim); font-size:16px; margin:0; line-height:1.55;
    animation:fadeUp .9s .35s ease backwards;
  }
  .divider{
    display:flex; align-items:center; gap:14px;
    width:min(560px,72vw); margin:14px auto 0;
    animation:fadeUp .9s .5s ease backwards;
  }
  .divider .line{ flex:1; height:1px }
  .divider .line:first-child{ background:linear-gradient(90deg,transparent,rgba(240,201,106,.8)) }
  .divider .line:last-child{ background:linear-gradient(90deg,rgba(240,201,106,.8),transparent) }
  .divider .gem{ color:var(--gold); font-size:13px; text-shadow:0 0 14px rgba(240,201,106,.9); animation:gemPulse 2.6s ease-in-out infinite }
  @keyframes gemPulse{ 0%,100%{ transform:scale(1) } 50%{ transform:scale(1.35) } }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(20px) } }
   .reset{
     width:34px; height:34px; border-radius:50%; padding:0;
     border:1px solid rgba(240,201,106,.35); background:rgba(240,201,106,.05);
     color:var(--gold); font-family:inherit; font-size:15px; line-height:1; cursor:pointer;
     animation:fadeUp .9s .65s ease backwards;
     transition:background .25s, box-shadow .25s, transform .25s;
   }
   .reset:hover{ background:rgba(240,201,106,.16); box-shadow:0 0 18px rgba(240,201,106,.25); transform:translateY(-2px) }

  .board{
    display:grid; grid-template-columns:repeat(2,1fr);
    grid-template-rows:repeat(5,minmax(0,1fr));
    gap:clamp(12px,1.8vw,22px); width:100%; max-width:1240px; margin:0 auto;
    flex:1 1 auto;
  }
  @media (max-width:560px){
    .board{grid-template-columns:1fr; max-width:420px; grid-template-rows:none; flex-grow:0}
    .cell{ aspect-ratio:1/1 }
  }

  .cell{
    position:relative; aspect-ratio:1/1; border-radius:24px;
    background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.014));
    border:1px solid rgba(240,201,106,.24);
    box-shadow:0 18px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; overflow:hidden;
    container-type:size;
    animation:cardIn .85s cubic-bezier(.2,.9,.25,1) backwards;
    transition:transform .3s cubic-bezier(.2,.9,.25,1), border-color .3s, box-shadow .3s;
  }
  @keyframes cardIn{ from{ opacity:0; transform:translateY(36px) scale(.94) } }
  .cell:hover{
    transform:translateY(-7px) scale(1.02);
    border-color:rgba(240,201,106,.8);
    box-shadow:0 0 22px rgba(240,201,106,.22), 0 0 60px rgba(74,134,255,.16), 0 26px 54px rgba(0,0,0,.55);
  }
  .cell:active{ transform:translateY(-3px) scale(.985) }
  .cell::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(115deg, transparent 32%, rgba(255,255,255,.07) 44%, rgba(255,244,214,.18) 50%, rgba(255,255,255,.07) 56%, transparent 68%);
    transform:translateX(-101%);
    transition:transform .9s ease;
  }
  .cell:hover::before{ transform:translateX(101%) }

  .num{
    font-size:clamp(50px,min(13vh,10vw),132px);
    font-size:min(62cqh,32cqw,128px);
    line-height:1; margin:auto;
    background:linear-gradient(180deg,#ffe9ad 8%,#f0c96a 46%,#a97f28 96%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:numPulse 3.4s ease-in-out infinite;
  }
  @keyframes numPulse{
    0%,100%{ filter:drop-shadow(0 0 10px rgba(240,201,106,.35)) }
    50%{ filter:drop-shadow(0 0 26px rgba(240,201,106,.7)) drop-shadow(0 0 46px rgba(74,134,255,.3)) }
  }
  .tag{
    padding:0 0 14px; text-align:center;
    color:var(--ink-dim); font-size:13px; letter-spacing:.1em;
  }

  .cell.done{
    padding:14px 16px 16px;
    background:linear-gradient(180deg, rgba(240,201,106,.14), rgba(74,134,255,.09) 55%, rgba(240,201,106,.05));
    border-color:rgba(240,201,106,.55);
    box-shadow:0 0 18px rgba(240,201,106,.12), 0 18px 40px rgba(0,0,0,.45);
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    text-align:center;
  }
  .cell.done .label{
    color:var(--gold); font-size:clamp(13px,1.5vw,18px); font-weight:700; letter-spacing:.24em;
    text-shadow:0 0 16px rgba(240,201,106,.8);
    animation:cmdIn .55s ease backwards;
    margin:0;
    font-size:clamp(12px, min(9cqh,1.5vw), 18px);
  }
  .cell.done .cmd{
    font-size:clamp(17px,1.9vw,24px); font-weight:700; line-height:1.38;
    color:#fdf4de;
    text-shadow:0 0 20px rgba(240,201,106,.28);
    animation:cmdIn .7s .1s ease backwards;
    margin:auto 0;
    font-size:clamp(15px, min(11cqh,1.9vw), 24px);
  }
  @container (max-height:105px){
    .cell.done .label{ display:none }
    .cell.done .cmd{ font-size:clamp(13px, min(9cqh,1.6vw), 20px) }
  }
  @keyframes cmdIn{ from{ opacity:0; transform:translateY(12px) } }
  .cell.done:hover .cmd{ color:#fff }

  /* stage */
  .stage{
    position:fixed; inset:0; display:none;
    background:#000;
    z-index:50;
  }
  .stage.open{ display:block; animation:stageIn .3s ease both }
  @keyframes stageIn{ from{ opacity:0 } }
  .frame{
    position:relative;
    width:100%; height:100%;
    animation:pop .42s cubic-bezier(.2,.9,.3,1.25) both;
  }
  @keyframes pop{ from{ transform:scale(.9); opacity:0 } }
  @keyframes frameGlow{
    0%,100%{ box-shadow:0 0 0 1px rgba(74,134,255,.16), 0 40px 120px rgba(0,0,0,.72), 0 0 55px rgba(240,201,106,.14) }
    50%{ box-shadow:0 0 0 1px rgba(74,134,255,.3), 0 40px 120px rgba(0,0,0,.72), 0 0 80px rgba(240,201,106,.26) }
  }
  .bar{
    position:absolute; top:0; left:0; right:0; z-index:2;
    display:flex; align-items:center; gap:14px;
    padding:14px 18px;
    background:linear-gradient(180deg, rgba(0,0,0,.55), transparent);
  }
  .bar .t{
    font-size:19px; font-weight:700; letter-spacing:.05em;
    background:linear-gradient(100deg,#8f6d22,#f7d98b 45%,#fff6d8);
    background-size:260% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shimmer 7s linear infinite;
  }
  .close{
    margin-left:auto; width:34px; height:34px; border-radius:50%;
    border:1px solid rgba(240,201,106,.4); background:rgba(240,201,106,.08);
    color:var(--gold); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .2s, box-shadow .2s;
  }
  .close:hover{ background:rgba(240,201,106,.22); box-shadow:0 0 14px rgba(240,201,106,.35) }

  .media{
    position:absolute; inset:0;
    background:#000;
  }
  .media video{ display:block; width:100%; height:100%; object-fit:contain; cursor:pointer }
  .placeholder{
    width:100%; height:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px; color:var(--ink-dim);
  }
  .placeholder .big{ font-size:58px; animation:phPulse 2.2s ease-in-out infinite }
  @keyframes phPulse{ 0%,100%{ opacity:.35; transform:scale(1) } 50%{ opacity:.75; transform:scale(1.12) } }
  .placeholder .hint{ font-size:14px; letter-spacing:.05em }

  .controls{
    position:absolute; left:0; right:0; bottom:0; z-index:2;
    display:flex; align-items:center; gap:12px;
    padding:12px 16px;
    background:linear-gradient(0deg, rgba(0,0,0,.55), transparent);
  }
  .bar-progress{
    flex:1; height:6px; border-radius:6px;
    background:rgba(255,255,255,.12); cursor:pointer; overflow:hidden;
  }
  .bar-progress .fill{
    height:100%; width:0%;
    background:linear-gradient(90deg,#8f6d22,#f0c96a);
    box-shadow:0 0 10px rgba(240,201,106,.8);
  }
  .btn{
    min-width:32px; height:32px; border-radius:50%;
    border:1px solid rgba(74,134,255,.45); background:rgba(74,134,255,.12);
    color:var(--gold); cursor:pointer; font-size:13px;
    display:flex; align-items:center; justify-content:center;
    transition:background .2s, box-shadow .2s;
  }
  .btn:hover{ background:rgba(74,134,255,.26); box-shadow:0 0 12px rgba(74,134,255,.4) }

  .imgbox{ position:absolute; inset:0; display:flex; justify-content:center; align-items:center; background:#000; }
  .imgbox img{
    max-width:100%; max-height:100%;
    width:auto; height:auto; display:block;
    border-radius:12px;
    box-shadow:0 0 0 1px rgba(240,201,106,.4), 0 24px 70px rgba(0,0,0,.65), 0 0 44px rgba(74,134,255,.14);
    cursor:pointer;
    animation:imgIn .55s cubic-bezier(.2,.9,.25,1) both;
  }
  @keyframes imgIn{ from{ opacity:0; transform:scale(.94) } }
</style>
</head>
<body>
  <canvas id="dust"></canvas>
  <div id="glow"></div>

  <div class="wrap">
    <header>
      <h1>Казачьи заповеди</h1>
      <div class="divider"><span class="line"></span><span class="gem">✦</span><span class="line"></span></div>
      <button class="reset" id="resetBtn" type="button" title="Начать заново" aria-label="Начать заново">🔁</button>
    </header>

    <div class="board" id="board" aria-label="Девять заповедей"></div>
  </div>

  <div class="stage" id="stage">
    <div class="frame" id="frame"></div>
  </div>

<script>
const DATA = [
  {cmd:'Честь и доброе имя казака дороже жизни',
   pv:['Казак честь не кинет, хоть головушка сгинет','Лучше глаза лишиться, чем доброго имени']},
  {cmd:'Казаки все равны в правах',
   pv:['В кулаке все пальцы равны','Была бы голова, будет и булава']},
  {cmd:'Люби Родину, служи преданно своему народу',
   pv:['Береги землю родимую – как мать любимую','Казак скорей умрёт, чем с родной земли уйдёт']},
  {cmd:'Держи слово, слово казака дорого',
   pv:['Казан проверяют по звону, казака – по слову','Кто слову верен, тот и в деле надёжен']},
  {cmd:'Чти старших, уважай старость',
   pv:['Господа старики – первейшие казаки','Кто старших уважает, тому Бог помогает']},
  {cmd:'Держись веры предков, поступай по обычаям своего народа',
   pv:['Казаком быть – Богу служить','Недолго той земле стоять, где начнут устои ломать']},
  {cmd:'Погибай, а товарища выручай',
   pv:['Дружба и братство дороже богатства','Казак за казака горой стоит']},
  {cmd:'Будь трудолюбив, не бездействуй',
   pv:['Казачья земля дармоедов не кормит','От безделья не бывает у казака веселья']},
  {cmd:'Береги семью свою, служи ей примером',
   pv:['Согласную семью горе не берёт','За морем теплее, а в дому своём светлее']},
];

const board = document.getElementById('board');
const stage = document.getElementById('stage');
const frame = document.getElementById('frame');
const done = new Set();
let openState = null; // {type:'video'|'image', n}
let activeVideo = null;

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function buildBoard(){
  for(let i=1;i<=9;i++){
    const c=document.createElement('div');
    c.className='cell';
    c.dataset.n=i;
    c.style.animationDelay = (120 + i*80) + 'ms';
    renderCell(c,i);
    c.addEventListener('click',()=>onCell(i));
    board.appendChild(c);
  }
}

function renderCell(c,i){
  c.style.animationDelay='0ms';
  if(done.has(i)){
    c.classList.add('done');
    c.innerHTML=`<div class="label">✦ ЗАПОВЕДЬ ✦</div><div class="cmd">${esc(DATA[i-1].cmd)}</div>`;
  }else{
    c.classList.remove('done');
    c.innerHTML=`<div class="num">${i}</div><div class="tag">заповедь ${i}</div>`;
  }
}

function resetAll(){
  done.clear();
  board.querySelectorAll('.cell').forEach(c=>renderCell(c, +c.dataset.n));
}

function onCell(i){
  if(done.has(i)){ openImage(i); }
  else{ openVideo(i); }
}

function closePlayer(){
  const n = openState ? openState.n : null;
  if(openState && openState.type==='video'){
    done.add(openState.n);
  }
  if(activeVideo){ try{activeVideo.pause();}catch(e){} activeVideo=null; }
  openState=null;
  stage.classList.remove('open');
  frame.innerHTML='';
  if(n!=null){
    const c = board.querySelector(`.cell[data-n="${n}"]`);
    if(c){ renderCell(c, n); }
  }
}

function openVideo(i){
  openState={type:'video', n:i};
  frame.innerHTML='';
  const bar=document.createElement('div'); bar.className='bar';
  bar.innerHTML=`<div class="t">Заповедь ${i}</div><button class="close" aria-label="закрыть">✕</button>`;

  const media=document.createElement('div'); media.className='media';
  const video=document.createElement('video');
  video.src=`Видео/${i}.mp4`;
  video.playsInline=true; video.preload='auto';
  media.appendChild(video);

  const controls=document.createElement('div'); controls.className='controls';
  const prog=document.createElement('div'); prog.className='bar-progress';
  const fill=document.createElement('div'); fill.className='fill';
  prog.appendChild(fill);
  const btnPlay=document.createElement('button'); btnPlay.className='btn'; btnPlay.textContent='⏸';
  const btnMute=document.createElement('button'); btnMute.className='btn'; btnMute.textContent='🔊';
  controls.appendChild(prog); controls.appendChild(btnPlay); controls.appendChild(btnMute);

  frame.appendChild(bar); frame.appendChild(media); frame.appendChild(controls);
  stage.classList.add('open');

  activeVideo=video;
  const togglePlay=()=>{
    if(video.ended){ video.currentTime=0; video.play().catch(()=>{}); btnPlay.textContent='⏸'; }
    else if(video.paused){ video.play().catch(()=>{}); btnPlay.textContent='⏸'; }
    else{ video.pause(); btnPlay.textContent='▶'; }
  };
  video.addEventListener('click',togglePlay);
  btnPlay.addEventListener('click',togglePlay);
  btnMute.addEventListener('click',()=>{ video.muted=!video.muted; btnMute.textContent=video.muted?'🔇':'🔊'; });
  prog.addEventListener('click',(e)=>{
    const r=prog.getBoundingClientRect(); const ratio=(e.clientX-r.left)/r.width;
    if(video.duration){ video.currentTime=ratio*video.duration; }
  });
  video.addEventListener('timeupdate',()=>{
    if(video.duration){ fill.style.width=(video.currentTime/video.duration*100)+'%'; }
  });
  video.addEventListener('ended',()=>{ btnPlay.textContent='↺'; btnPlay.title='повтор'; });
  video.addEventListener('error',()=>{
    activeVideo=null;
    media.innerHTML='';
    const ph=document.createElement('div'); ph.className='placeholder';
    ph.innerHTML=`<div class="big">🎬</div><div>Видео ещё готовится</div><div class="hint">здесь скоро прозвучит слово</div>`;
    media.appendChild(ph);
    controls.style.display='none';
  });
  video.play().catch(()=>{});
}

function openImage(i){
  openState={type:'image', n:i};
  frame.innerHTML='';
  const bar=document.createElement('div'); bar.className='bar';
  bar.innerHTML=`<div class="t">Заповедь ${i}</div><button class="close" aria-label="закрыть">✕</button>`;
  const imgbox=document.createElement('div'); imgbox.className='imgbox';
  const img=document.createElement('img');
  img.src=`знаменитые казаки/Слайд${i}.JPG`;
  img.alt=`Слайд ${i}`;
  imgbox.appendChild(img);
  img.addEventListener('click',()=>closePlayer());
  frame.appendChild(bar); frame.appendChild(imgbox);
  stage.classList.add('open');
}

stage.addEventListener('click',(e)=>{
  if(e.target===stage){ closePlayer(); }
});
frame.addEventListener('click',(e)=>{
  if(e.target.closest('.close')){ closePlayer(); }
});
document.getElementById('resetBtn').addEventListener('click',resetAll);
document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape'){ closePlayer(); }
});

/* ---- golden dust ---- */
(function(){
  const cv=document.getElementById('dust');
  const cx=cv.getContext('2d');
  let W,H,parts=[];
  function resize(){ W=cv.width=innerWidth; H=cv.height=innerHeight; }
  addEventListener('resize',resize); resize();
  function spawn(init){
    return {
      x:Math.random()*W,
      y:init? Math.random()*H : H+12,
      s:Math.random()*1.9+.5,
      vy:-(Math.random()*.28+.08),
      vx:(Math.random()-.5)*.22,
      a:Math.random()*.55+.18,
      tw:Math.random()*Math.PI*2
    };
  }
  for(let i=0;i<80;i++) parts.push(spawn(true));
  function tick(){
    cx.clearRect(0,0,W,H);
    for(let i=0;i<parts.length;i++){
      const p=parts[i];
      p.y+=p.vy; p.x+=p.vx; p.tw+=.021;
      if(p.y<-12){ p.y=H+12; p.x=Math.random()*W; }
      cx.globalAlpha=Math.max(.04, p.a*(.55+.45*Math.sin(p.tw)));
      cx.fillStyle='#f0c96a';
      cx.beginPath(); cx.arc(p.x,p.y,p.s,0,7); cx.fill();
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

/* ---- cursor glow ---- */
(function(){
  const g=document.getElementById('glow');
  addEventListener('pointermove',(e)=>{
    g.style.transform=`translate(${e.clientX-320}px, ${e.clientY-320}px)`;
  });
})();

buildBoard();
for(let i=1;i<=9;i++)done.add(i);
document.querySelectorAll('.cell').forEach(c=>renderCell(c,+c.dataset.n));
</script>
</body>
</html>
