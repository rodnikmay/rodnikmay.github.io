<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Наши поэты — «Родник»</title><link rel="stylesheet" href="../style.css"></head><body><header class="hero"><div class="wrap hero-inner"><span class="eyebrow">Голоса Майского</span><h1>Наши поэты</h1><p>Каталог авторов литературного объединения «Родник».</p></div><div class="mountain-art" aria-hidden="true"></div><div class="river-art" aria-hidden="true"></div><div class="city-line" aria-hidden="true"></div><div class="foreground" aria-hidden="true"></div></header><nav><div class="wrap"><button class="icon-btn menu-toggle" data-menu aria-label="Меню" aria-expanded="false">☰</button><div class="nav-links" data-links><a href="../index.html">Главная</a><a href="../history.html">История</a><a href="index.html">Наши поэты</a><a href="../creativity.html">Творчество</a></div><div class="tools"><button class="icon-btn" data-theme aria-label="Переключить тему">◐</button></div></div></nav><main class="wrap section"><section class="card reveal"><span class="tag">12 авторов</span><h2>Найдите своего автора</h2><div class="search-row"><input class="search" id="poetSearch" placeholder="Имя, фамилия, роль или описание…" aria-label="Поиск"><select class="filter" id="poetFilter"><option value="">Все роли</option><option>Основательница</option><option>Руководитель</option><option>Участница</option><option>Участник</option></select><button class="btn small" id="randomPoet" type="button">Случайный автор</button><button class="btn small" id="clearSearch" type="button">Сбросить</button></div><div class="result-meta"><span id="resultCount">Найдено: 0</span><span class="muted">Поиск работает сразу по мере ввода</span></div><div class="grid" id="poetGrid"></div><p id="empty" class="notice" hidden>По этому запросу авторов не найдено.</p></section></main><button class="btn to-top" aria-label="Наверх">↑</button><footer><div class="wrap">«Родник» · Майский</div></footer><script src="data.js"></script><script src="../app.js"></script><script>const grid=document.getElementById('poetGrid'),search=document.getElementById('poetSearch'),filter=document.getElementById('poetFilter'),empty=document.getElementById('empty'),count=document.getElementById('resultCount'),random=document.getElementById('randomPoet'),clear=document.getElementById('clearSearch');const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function mark(s,q){if(!q)return esc(s);const safe=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return esc(s).replace(new RegExp(`(${safe})`,'ig'),'<mark>$1</mark>')}function render(){const q=search.value.trim(),low=q.toLowerCase(),role=filter.value,rows=window.rodnikPoets.filter(p=>(!low||[p.name,p.role,p.short].join(' ').toLowerCase().includes(low))&&(!role||p.role===role));count.textContent=`Найдено: ${rows.length} из ${window.rodnikPoets.length}`;grid.innerHTML=rows.map(p=>`<a class="tile reveal visible" href="${p.url}"><span class="tag">${esc(p.role)}</span><h3>${mark(p.name,q)}</h3><p>${mark(p.short,q)}</p></a>`).join('');empty.hidden=rows.length>0}search.addEventListener('input',render);filter.addEventListener('change',render);clear.addEventListener('click',()=>{search.value='';filter.value='';render();search.focus()});random.addEventListener('click',()=>{const p=window.rodnikPoets[Math.floor(Math.random()*window.rodnikPoets.length)];if(p)location.href=p.url});render();</script></body></html>
