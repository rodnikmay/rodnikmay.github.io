<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Наши поэты — «Родник»</title><link rel="stylesheet" href="../style.css"></head><body><header><div class="wrap"><div class="eyebrow">Голоса Майского</div><h1 class="hero-title">Наши поэты</h1><p class="lead">Люди, которые превращают память, любовь к родному краю и наблюдения жизни в строки.</p></div></header><nav><div class="wrap"><button class="icon-btn menu-toggle" data-menu aria-label="Открыть меню" aria-expanded="false">☰</button><div class="nav-links" data-links><a href="../index.html">Главная</a><a href="../history.html">История</a><a href="index.html">Наши поэты</a><a href="../creativity.html">Творчество</a></div><div class="tools"><button class="icon-btn" data-theme aria-label="Переключить тему">◐</button></div></div></nav><main class="wrap main"><section class="card reveal"><span class="tag">Каталог авторов</span><h2>Познакомьтесь с участниками</h2><div class="search-row"><input class="search" id="poetSearch" placeholder="Поиск по имени…" aria-label="Поиск по имени"><select class="filter" id="poetFilter" aria-label="Фильтр по роли"><option value="">Все роли</option><option>Основательница</option><option>Руководитель</option><option>Участница</option></select></div><div class="grid" id="poetGrid"></div><p id="empty" class="notice" hidden>Ничего не найдено. Попробуйте изменить запрос.</p></section></main><button class="btn to-top" aria-label="Наверх">↑</button><footer><div class="wrap">«Родник» · Майский</div></footer><script src="data.js"></script><script src="../app.js"></script><script>const grid=document.getElementById('poetGrid'),search=document.getElementById('poetSearch'),filter=document.getElementById('poetFilter'),empty=document.getElementById('empty');function render(){const q=search.value.toLowerCase().trim(),role=filter.value;const rows=window.rodnikPoets.filter(p=>(!q||p.name.toLowerCase().includes(q))&&(!role||p.role===role));grid.innerHTML=rows.map(p=>`<a class="person reveal visible" href="${p.url}"><span class="tag">${p.role}</span><h3>${p.name}</h3><p>${p.short}</p><span class="arrow">→</span></a>`).join('');empty.hidden=rows.length>0}search.addEventListener('input',render);filter.addEventListener('change',render);render();</script></body></html>
